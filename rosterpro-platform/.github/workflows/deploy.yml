name: Build & Push Images

# Deliberately stops at "image is built and published to a registry" rather
# than assuming a specific deployment target (ECS, EC2 + SSH, Kubernetes,
# etc) — those differ enough between teams that guessing would likely be
# wrong. infra/aws/DEPLOYMENT_GUIDE.md documents pulling these images onto
# an EC2 instance as the recommended next step; swap that section out if
# you deploy to ECS/EKS instead. This workflow only runs after CI (the
# `ci` job below) has passed, and only on pushes to main — never on a PR,
# so a fork or a work-in-progress branch can't publish an image.

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_PROXY_TARGET=${{ secrets.PUBLIC_API_URL }}
            VITE_DEFAULT_STATION_ID=${{ secrets.DEFAULT_STATION_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

