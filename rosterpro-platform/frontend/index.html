<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RosterPro — AMD Line Maintenance</title>
    <meta name="theme-color" content="#2563EB" />
    <!-- iOS doesn't read the Web App Manifest for install/standalone behavior — these are the separate tags it actually needs. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RosterPro" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Inter/Lexend/JetBrains Mono back the --ui/--display/--mono tokens in
         rosterpro.css — previously --ui named Inter but nothing actually
         loaded it, so every page was silently falling back to the OS
         default font the whole time. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lexend:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
