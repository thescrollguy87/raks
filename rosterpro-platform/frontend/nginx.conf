server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: any path that isn't a real static file falls through to
    # index.html so React Router's client-side routes (e.g. /roster,
    # /qualifications) work on a hard refresh or direct link, not just when
    # navigated to from within the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively — Vite fingerprints filenames,
    # so a new deploy naturally gets new URLs and never serves a stale
    # cached bundle under the old name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached — it's what points the browser
    # at the current (fingerprinted) asset filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # If nginx is fronting the API too (single-EC2-instance deployment,
    # rather than the AWS guide's CloudFront+separate-backend setup), this
    # proxies /api straight through — uncomment and point at the backend
    # container/service name.
    # location /api/ {
    #     proxy_pass http://backend:4000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
